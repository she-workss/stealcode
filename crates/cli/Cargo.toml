[package]
name = "cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
homepage.workspace = true
license.workspace = true

[target.'cfg(windows)'.dependencies]
windows.workspace = true

[package.metadata.winresource]
FileDescription = "StealCode - AI-powered coding assistant"
ProductName = "StealCode"
OriginalFilename = "stealcode.exe"
LegalCopyright = "Copyright © he-thinks 2026"

[[bin]]
name = "stealcode"
path = "src/main.rs"

[features]
default = ["tui"]
all = ["desktop", "server", "tui", "voice", "web"]
desktop = ["dep:gui"]
server = ["dep:server"]
tui = ["dep:tui"]
voice = ["dep:voice", "tui?/voice", "gui?/voice"]
web = []

[dependencies]
anyhow.workspace = true
auto_update.workspace = true
clap = { version = "4.6", default-features = false, features = [
    "color",
    "derive",
    "help",
    "suggestions",
    "usage",
] }
clap_complete = { version = "4.6", default-features = false }
gui = { workspace = true, optional = true }
mimalloc = { version = "0.1", default-features = false }
paths.workspace = true
release_channel.workspace = true
reqwest.workspace = true
semver.workspace = true
server = { workspace = true, optional = true }
settings.workspace = true
telemetry.workspace = true
tokio.workspace = true
tower-http = { workspace = true, optional = true }
tracing.workspace = true
tui = { workspace = true, optional = true }
voice = { workspace = true, optional = true }

[target.'cfg(windows)'.build-dependencies]
winresource = { version = "0.1", default-features = false }

[lints]
workspace = true
