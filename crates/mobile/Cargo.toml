[package]
name = "mobile"
version.workspace = true
edition.workspace = true
authors.workspace = true
homepage.workspace = true
license.workspace = true

[lib]
name = "mobile"
crate-type = ["cdylib", "rlib", "staticlib"]

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
gpui-kit = { git = "https://github.com/longbridge/gpui-kit", rev = "9504b4658d57c59024a664f22b5ab55e070a24b4", default-features = false, features = [
    "component",
] }
gpui-pre = { version = "0.3", default-features = false }

[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "0.6", features = ["native-activity"] }
android_logger = "0.15"
gpui-mobile = { package = "gpui-pre-mobile", git = "https://github.com/longbridge/gpui-mobile", default-features = false }
log = "0.4"

[target.'cfg(target_os = "ios")'.dependencies]
gpui-mobile = { package = "gpui-pre-mobile", git = "https://github.com/longbridge/gpui-mobile", default-features = false, features = [
    "camera",
    "video_player",
] }
log = "0.4"
objc2 = "0.6"

[lints]
workspace = true
