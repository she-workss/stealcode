[alias]
nt = "nextest run --all-targets --all-features --status-level fail --no-fail-fast"

[env]
# Fix incorrect bindings generation with Cranelift on Windows:
# https://aws.github.io/aws-lc-rs/resources.html#bindings-generation
AWS_LC_SYS_NO_U1_BINDINGS = "1"

[build]
incremental = true

# Fix linking error with Cranelift and `-Clink-arg=-fuse-ld=lld` on Windows
# (pulp 0.22.3)
[profile.dev.package.pulp]
codegen-backend = "llvm"

# audio_engine's AVX2 kernels use intrinsics Cranelift doesn't implement
# (`psign.b`, `permps`), which trap at runtime in dev builds. Build it
# with LLVM so dev examples/apps actually run.
[profile.dev.package.audio_engine]
codegen-backend = "llvm"

[unstable]
build-std = ["alloc", "compiler_builtins", "core", "panic_unwind", "std"]
build-std-features = [
    # "backtrace",
    "optimize_for_size",
]
# checksum-freshness = true
codegen-backend = true
feature-unification = true
profile-hint-mostly-unused = true

[resolver]
feature-unification = "workspace"

# [profile.dev]
# codegen-backend = "cranelift"

[target.'cfg(all())']
rustflags = [
    "--cfg=tokio_unstable",
    "-Zcache-proc-macros",
    "-Zshare-generics=y",
    "-Zthreads=0",
    "-Znext-solver=globally",
    # "-Zlocation-detail=none",
]

[target.'cfg(target_arch = "x86_64")']
rustflags = ["-Ctarget-cpu=x86-64-v3"]

[target.'cfg(windows)']
rustflags = ["--cfg=windows_slim_errors", "-Clink-arg=-fuse-ld=lld"]

[target.'cfg(target_os = "linux")']
linker = "clang"
rustflags = ["-Clink-arg=-fuse-ld=mold"]

[target.'cfg(target_os = "macos")']
linker = "clang"
rustflags = ["-Clink-arg=-fuse-ld=lld"]
