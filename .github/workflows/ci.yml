name: CI

on:
  pull_request:
  push:
    branches:
      - "*"
    tags:
      - "*"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # rustc nightly ICEs ("unexpected rigid alias in layout_of after
  # normalization") on the new solver + cranelift rustflags applied to
  # clippy/doc. Use just the stable-to-use subset for the CI-only build.
  CARGO_ENCODED_RUSTFLAGS: "--cfg=tokio_unstable\x1F--cfg=windows_slim_errors"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: clippy, rustfmt, rustc-codegen-cranelift-preview
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libssl-dev \
            pkg-config \
            libgtk-3-dev \
            libxdo-dev \
            libayatana-appindicator3-dev \
            mold
      - name: Check
        run: cargo clippy --workspace --all-targets --features cli/all
      - name: rustfmt
        run: cargo fmt --all --check

  check-docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustc-codegen-cranelift-preview
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libssl-dev \
            pkg-config \
            libgtk-3-dev \
            libxdo-dev \
            libayatana-appindicator3-dev \
            mold
      - name: cargo doc
        run: cargo doc --features cli/all --no-deps
    env:
      RUSTDOCFLAGS: "-D rustdoc::all -A rustdoc::private-doc-tests -A rustdoc::missing-crate-level-docs"

  test-versions:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustc-codegen-cranelift-preview
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libssl-dev \
            pkg-config \
            libgtk-3-dev \
            libxdo-dev \
            libayatana-appindicator3-dev \
            mold
      - name: Run tests
        run: cargo nt

  # (04.10.2025) Note: Doctests are currently not supported because of
  # limitations in stable Rust. For now, run doctests in a separate step with
  # cargo test --doc.
  # Source: https://nexte.st/#quick-start
  test-docs:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustc-codegen-cranelift-preview
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libssl-dev \
            pkg-config \
            libgtk-3-dev \
            libxdo-dev \
            libayatana-appindicator3-dev \
            mold
      - name: Run doc tests
        run: cargo test --features cli/all --doc

  deny-check:
    name: cargo-deny check
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.checks == 'advisories' }}
    strategy:
      matrix:
        checks:
          - advisories
          - bans licenses sources
    steps:
      - uses: actions/checkout@v5
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check ${{ matrix.checks }}
          manifest-path: Cargo.toml

  dependencies-are-sorted:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install cargo-sort
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-sort
      - name: Check dependency tables
        run: cargo sort --workspace --grouped --check

  typos:
    name: Spellcheck with Typos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Spellcheck repository
        uses: crate-ci/typos@v1.37.2
    env:
      CLICOLOR: 1
