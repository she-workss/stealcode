name: bump_stealcode_version

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version part to bump: major, minor, or patch"
        type: choice
        options: [major, minor, patch]
        default: minor
      channel:
        description: "Channel to tag: stable or nightly"
        type: choice
        options: [stable, nightly]
        default: stable

permissions:
  contents: write
  actions: write

jobs:
  bump_version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - name: Install cargo-edit
        run: cargo install cargo-edit --locked

      - name: Bump version
        run: cargo set-version --workspace --bump ${{ inputs.bump }}

      - id: version
        name: Compute plain version (no leading v)
        run: echo "version=$(echo '${{ steps.resolve.outputs.tag }}' | sed 's/^v//')" >> "$GITHUB_OUTPUT"

      - id: tag
        name: Compute tag name
        run: |
          if [ "${{ inputs.channel }}" = "nightly" ]; then
            echo "tag=v${{ steps.version.outputs.version }}-nightly" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v${{ steps.version.outputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Bump StealCode to ${{ steps.tag.outputs.tag }}"
          git tag "${{ steps.tag.outputs.tag }}"
          git push origin main
          git push origin "${{ steps.tag.outputs.tag }}"

      - name: Trigger release build
        run: |
          gh workflow run release.yml \
            --repo he-thinks/stealcode \
            --ref "${{ steps.tag.outputs.tag }}" \
            -f tag="${{ steps.tag.outputs.tag }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
