name: bump_stealcode_version

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version part to bump: major, minor, or patch"
        type: choice
        options: [major, minor, patch]
        default: minor
      channel:
        description: "Channel to tag: stable or nightly"
        type: choice
        options: [stable, nightly]
        default: stable

permissions:
  contents: write
  actions: write

jobs:
  bump_version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - name: Install cargo-edit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-edit

      - name: Bump version
        run: cargo set-version --workspace --bump ${{ inputs.bump }}

      - id: version
        name: Read bumped version from workspace Cargo.toml
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml)
          if [ -z "$version" ]; then
            echo "::error::could not determine version after bump"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - id: tag
        name: Compute tag name
        run: |
          if [ "${{ inputs.channel }}" = "nightly" ]; then
            echo "tag=v${{ steps.version.outputs.version }}-pre" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v${{ steps.version.outputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Bump StealCode to ${{ steps.tag.outputs.tag }}"
          git tag "${{ steps.tag.outputs.tag }}"
          git push origin main
          git push origin "${{ steps.tag.outputs.tag }}"
          # The tag push above does NOT trigger `release.yml` by itself:
          # GitHub ignores push events performed with GITHUB_TOKEN (the
          # documented "automatic token authentication" behavior).
          # workflow_dispatch is the one exception that does start a run,
          # so dispatch explicitly - on `main` rather than the just-created
          # tag, to avoid racing GitHub's workflow indexer (HTTP 422).

      - name: Trigger release build
        run: |
          gh workflow run release.yml \
            --repo she-workss/stealcode \
            --ref main \
            -f tag="${{ steps.tag.outputs.tag }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
