# main is the development line. A minor release cuts a new vX.Y.x branch from
# `base` (default main); when a fresh branch is cut, main is then bumped to the
# same version so the next cut gets the next minor instead of colliding with an
# existing tag. The daily nightly dispatch passes branch=main, which already
# exists, so it neither cuts a branch nor bumps main. Cutting a branch from a
# `base` other than main (a backport) does not move main.
name: bump_stealcode_version

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version part to bump: major, minor, or patch"
        type: choice
        options: [major, minor, patch]
        default: minor
      channel:
        description: "Channel to tag: stable or nightly"
        type: choice
        options: [stable, nightly]
        default: stable
      branch:
        description: "Branch to bump and tag on (e.g. v0.14.x; main for nightly)"
        type: string
        default: main
      base:
        description: "Ref to cut a NEW release branch from (ignored when the branch already exists)"
        type: string
        default: main
      bump_main:
        description: "After cutting a new release branch, also bump main to the same version (keeps the next minor release from colliding)"
        type: boolean
        default: true

permissions:
  contents: write
  actions: write

jobs:
  bump_version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - id: branch
        name: Checkout or create release branch
        run: |
          if git show-ref --verify --quiet "refs/remotes/origin/${{ inputs.branch }}"; then
            echo "Branch ${{ inputs.branch }} already exists, checking it out"
            echo "created=false" >> "$GITHUB_OUTPUT"
            git checkout "${{ inputs.branch }}"
            git pull --ff-only origin "${{ inputs.branch }}"
          else
            echo "Creating ${{ inputs.branch }} from ${{ inputs.base }}"
            echo "created=true" >> "$GITHUB_OUTPUT"
            git checkout -b "${{ inputs.branch }}" "origin/${{ inputs.base }}"
          fi
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}

      - name: Install cargo-edit
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-edit

      - name: Bump version
        run: cargo set-version --workspace --bump ${{ inputs.bump }}

      - id: version
        name: Read bumped version from workspace Cargo.toml
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml)
          if [ -z "$version" ]; then
            echo "::error::could not determine version after bump"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - id: tag
        name: Compute tag name
        run: |
          if [ "${{ inputs.channel }}" = "nightly" ]; then
            echo "tag=v${{ steps.version.outputs.version }}-pre" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v${{ steps.version.outputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Fail if the tag already exists
        run: |
          rc=0
          git ls-remote --exit-code --tags origin "refs/tags/${{ steps.tag.outputs.tag }}" >/dev/null || rc=$?
          if [ "$rc" -eq 0 ]; then
            echo "::error::tag ${{ steps.tag.outputs.tag }} already exists - bump a different version part or delete/retag deliberately"
            exit 1
          fi
          if [ "$rc" -ne 2 ]; then
            echo "::error::could not query remote tags (git ls-remote exit $rc); refusing to tag"
            exit 1
          fi

      - name: Commit and tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # The commit bump only touches Cargo files, but the *first* push of a
          # stable branch introduces .github/workflows content, which GitHub
          # refuses to accept from the default GITHUB_TOKEN. RELEASE_TOKEN has
          # the `workflow` scope, so route pushes through it. actions/checkout
          # also injects a GITHUB_TOKEN-based http.extraheader that would
          # shadow the token embedded in the URL, so strip it first.
          git config --unset-all http.https://github.com/.extraheader || true
          git remote set-url origin "https://x-access-token:${RELEASE_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git add -A
          git commit -m "Bump StealCode to ${{ steps.tag.outputs.tag }}"
          git tag "${{ steps.tag.outputs.tag }}"
          git push origin "${{ inputs.branch }}"
          git push origin "${{ steps.tag.outputs.tag }}"
          # A push made with RELEASE_TOKEN DOES trigger `release.yml` via its
          # `push: tags: v*` trigger, so no explicit dispatch is needed.
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}

      - name: Bump main to the same version
        if: steps.branch.outputs.created == 'true' && inputs.bump_main && inputs.base == 'main'
        run: |
          git checkout main
          git pull --ff-only origin main
          cargo set-version --workspace "${{ steps.version.outputs.version }}"
          git add -A
          git commit -m "Bump StealCode to ${{ steps.tag.outputs.tag }}"
          git push origin main
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}