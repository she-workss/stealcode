name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and release (must already exist), e.g. v0.2.0 or v0.2.0-pre"
        required: true

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  create_release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      channel: ${{ steps.channel.outputs.channel }}
    steps:
      - id: resolve
        name: Resolve tag
        run: echo "tag=${{ inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"
      - id: version
        name: Compute plain version (no leading v)
        run: echo "version=$(echo '${{ steps.resolve.outputs.tag }}' | sed 's/^v//')" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.ref_name }}
      - id: channel
        name: Determine release channel
        run: |
          if [[ "${{ steps.resolve.outputs.tag }}" == *-pre ]]; then
            echo "channel=nightly" >> "$GITHUB_OUTPUT"
          else
            echo "channel=stable" >> "$GITHUB_OUTPUT"
          fi
      - name: Generate release notes
        run: bash script/draft-release-notes.sh "${{ steps.resolve.outputs.tag }}" > release-notes.md
      - name: Create release
        run: bash script/create-draft-release.sh release-notes.md ${{ steps.channel.outputs.channel }} ${{ steps.resolve.outputs.tag }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  bundle:
    needs: create_release
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            arch: x86_64
            target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            arch: aarch64
            target: aarch64-pc-windows-msvc
          - os: ubuntu-latest
            arch: x86_64
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            arch: aarch64
            target: aarch64-unknown-linux-gnu
          - os: macos-26
            arch: aarch64
            target: aarch64-apple-darwin
          - os: macos-26-intel
            arch: x86_64
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.create_release.outputs.tag }}
      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: always()

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libpulse-dev \
            libssl-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            pkg-config \
            libgtk-3-dev \
            libxdo-dev \
            libayatana-appindicator3-dev \
            mold

      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        run: brew install lld

      - name: Bundle (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./script/bundle-windows.ps1 -Architecture ${{ matrix.arch }} -Version ${{ needs.create_release.outputs.version }} -Channel ${{ needs.create_release.outputs.channel }}

      - name: Bundle (macOS)
        if: runner.os == 'macOS'
        run: bash script/bundle-mac.sh ${{ matrix.arch }} ${{ needs.create_release.outputs.version }} ${{ needs.create_release.outputs.channel }}

      - name: Bundle (Linux)
        if: runner.os == 'Linux'
        run: bash script/bundle-linux.sh ${{ matrix.arch }} ${{ needs.create_release.outputs.version }} ${{ needs.create_release.outputs.channel }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: stealcode-${{ runner.os }}-${{ matrix.arch }}
          path: |
            target/StealCode-*.exe
            target/StealCode-*.dmg
            target/stealcode-linux-*.tar.gz
          if-no-files-found: error

  bundle_android:
    needs: create_release
    strategy:
      fail-fast: false
      matrix:
        abi:
          - arm64-v8a
          - armeabi-v7a
          - x86
          - x86_64
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.create_release.outputs.tag }}
      - uses: dtolnay/rust-toolchain@nightly
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: android-${{ matrix.abi }}
          save-if: always()

      - uses: taiki-e/install-action@v2
        with:
          tool: just

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y mold

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --version 4.1.2 --locked

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Make gradlew executable
        run: chmod +x crates/mobile/assets/android/gradle/gradlew

      - name: Decode release keystore
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/stealcode-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/stealcode-release.jks" >> "$GITHUB_ENV"

      - name: Warn when release signing is not configured
        if: env.ANDROID_KEYSTORE_BASE64 == ''
        run: echo "::warning::ANDROID_KEYSTORE_BASE64 is not set - the APK will be signed with the debug key"

      - name: Build APK
        run: just abi=${{ matrix.abi }} android-release

      - name: Rename APK for the release
        run: mv target/android/outputs/apk/release/stealcode.apk "StealCode-${{ matrix.abi }}.apk"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: stealcode-android-${{ matrix.abi }}
          path: StealCode-${{ matrix.abi }}.apk
          if-no-files-found: error

  upload_release_assets:
    needs:
      - create_release
      - bundle
      - bundle_android
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Upload to release
        run: gh release upload "${{ needs.create_release.outputs.tag }}" --repo she-workss/stealcode artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  validate_release_assets:
    needs:
      - create_release
      - upload_release_assets
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Validate expected assets are present
        run: |
          EXPECTED='["StealCode-x86_64.exe", "StealCode-aarch64.exe", "StealCode-aarch64.dmg", "StealCode-x86_64.dmg", "stealcode-linux-x86_64.tar.gz", "stealcode-linux-aarch64.tar.gz", "StealCode-arm64-v8a.apk", "StealCode-armeabi-v7a.apk", "StealCode-x86.apk", "StealCode-x86_64.apk"]'
          ACTUAL=$(gh release view "${{ needs.create_release.outputs.tag }}" --repo she-workss/stealcode --json assets -q '[.assets[].name]')
          MISSING=$(echo "$EXPECTED" | jq -r --argjson actual "$ACTUAL" '. - $actual | .[]')
          if [ -n "$MISSING" ]; then
            echo "Missing assets:"
            echo "$MISSING"
            exit 1
          fi
          echo "All expected assets present."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # A release is always created as a draft first. Both channels (stable and
  # nightly) are published automatically once `validate_release_assets`
  # passes; a failed build or validation leaves the release as a draft.
  auto_publish:
    needs:
      - create_release
      - validate_release_assets
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish release (remove draft flag)
        run: gh release edit "${{ needs.create_release.outputs.tag }}" --repo she-workss/stealcode --draft=false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

